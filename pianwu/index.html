<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pump 片务 · MarkPump</title>
<link rel="stylesheet" href="style.css?v=20261118-library">
<script type="module" src="app.js?v=20261118-library"></script>
</head>
<body>
<header><h1><span class="brand-icon" aria-hidden="true">🎙︎</span> Pump 片务</h1><a href="/" class="back">MarkPump ↗</a><button id="add" class="primary">新建作品</button></header>
<main>
<nav aria-label="片务导航"><a href="#board">大屏</a><a href="#calendar">日历</a><a href="#archive">片库</a></nav>
<div class="actions data-actions" aria-label="导入与备份">
  <button id="import-package" type="button">导入工作室作品包</button>
  <button id="export-backup" type="button">备份作品记录</button>
  <button id="import-backup" type="button">恢复作品记录</button>
  <input id="package-file" type="file" accept=".pumpwork" hidden>
  <input id="backup-file" type="file" accept=".json,application/json" hidden>
</div>
<p class="muted">作品记录和成片保存在当前浏览器。记录备份包含排期、链接和数据历史，成片文件请另行保留。</p>
<p id="notice" role="status" hidden></p>
<section id="view"></section>
</main>
<dialog id="editor">
<form id="work-form">
<h2 id="editor-title">作品</h2>
<label>作品标题<input name="title" required maxlength="160"></label>
<label>计划发布日期<input name="date" type="date"></label>
<div class="video-field">
  <label id="video-label" for="work-video">导入成片（可选）</label>
  <input id="work-video" type="file" accept="video/mp4,video/quicktime,video/webm,.mp4,.mov,.webm">
  <p class="muted" id="video-info">选择 MP4、MOV 或 WebM。视频保存在当前浏览器。</p>
  <button id="video-preview" type="button" hidden>打开已保存成片</button>
</div>
<div id="platform-fields"></div>
<label>备注<textarea name="notes" maxlength="2000" rows="3"></textarea></label>
<p id="form-error" role="alert" hidden></p>
<div class="actions"><button id="cancel" type="button">取消</button><button class="primary" type="submit">保存作品</button></div>
</form>
</dialog>
</body>
</html>
