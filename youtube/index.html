<script>
(() => {
  const box = document.getElementById("ytList"), upd = document.getElementById("ytUpd"), { esc, fmtDate } = MP;
  const empty = (t, s) => { box.innerHTML = `<div class="empty-box"><b>${t}</b>${s}<br><br><a class="btn yt" href="https://www.youtube.com/@DGBGJC?sub_confirmation=1" target="_blank" rel="noopener">订阅频道，第一时间收到更新</a></div>`; };
  MP.json("/youtube/videos.json").then(d => {
    const vs = (d.videos || []).filter(v => /^[\w-]{6,20}$/.test(v.id || ""));
    if (d.fetchedAt) upd.textContent = "列表更新于 " + fmtDate(d.fetchedAt, true) + "（北京时间）";
    if (!vs.length) return empty("新视频正在路上", "频道暂时还没有公开视频，敬请期待。");
    box.innerHTML = `<div class="vgrid">` + vs.map((v, i) => `<a class="vc${i === 0 ? " new" : ""}" href="https://www.youtube.com/watch?v=${v.id}" target="_blank" rel="noopener" data-ev="yt-video">
      <div class="th"><img loading="lazy" src="https://i.ytimg.com/vi/${v.id}/hqdefault.jpg" alt="">${i === 0 ? "<i>最新</i>" : ""}</div>
      <div class="bd"><b>${esc(v.title)}</b><div class="m">${esc(fmtDate(v.published))}</div></div></a>`).join("") + `</div>`;
  }).catch(() => empty("视频列表暂时打不开", "可以直接去 YouTube 频道看最新视频。"));
})();
</script>
